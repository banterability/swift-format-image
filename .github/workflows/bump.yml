name: Bump swift-format

on:
  workflow_dispatch:
    inputs:
      swift_format_version:
        description: swift-format release to build, e.g. 605 for the newest 605.x.y or 605.0.0 for that one
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/bump.sh "$SWIFT_FORMAT_VERSION"
        env:
          SWIFT_FORMAT_VERSION: ${{ inputs.swift_format_version }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "bump-swift-format-$SWIFT_FORMAT_VERSION"
          git commit --all --message "Build swift-format $SWIFT_FORMAT_VERSION"
          git push --set-upstream origin "bump-swift-format-$SWIFT_FORMAT_VERSION"
          gh pr create --fill --body "Merging runs the Build workflow, which publishes the release."
        env:
          SWIFT_FORMAT_VERSION: ${{ inputs.swift_format_version }}
          GH_TOKEN: ${{ github.token }}
