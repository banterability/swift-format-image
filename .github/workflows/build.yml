name: Build

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/swift-format

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: versions
        run: |
          echo "swift=$(sed -nE 's/^FROM swift:([0-9]+\.[0-9]+)-[a-z]+@.*/\1/p' Dockerfile)" | tee -a "$GITHUB_OUTPUT"
          echo "swift_format=$(sed -nE 's/^ARG VERSION=(.*)/\1/p' Dockerfile)" | tee -a "$GITHUB_OUTPUT"
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: docker build --progress plain --tag "$IMAGE:$SWIFT" --tag "$IMAGE:$SWIFT_FORMAT" .
        env:
          SWIFT: ${{ steps.versions.outputs.swift }}
          SWIFT_FORMAT: ${{ steps.versions.outputs.swift_format }}
      - run: test "$(docker run --rm "$IMAGE:$SWIFT" --version)" = "$SWIFT_FORMAT"
        env:
          SWIFT: ${{ steps.versions.outputs.swift }}
          SWIFT_FORMAT: ${{ steps.versions.outputs.swift_format }}
      - id: push
        run: |
          docker push "$IMAGE:$SWIFT_FORMAT"
          docker push "$IMAGE:$SWIFT" | tee push.log
          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' push.log)
          echo "digest=$digest" | tee -a "$GITHUB_OUTPUT"
          printf 'Pin consumers to\n\n    %s:%s@%s\n' "$IMAGE" "$SWIFT" "$digest" >> "$GITHUB_STEP_SUMMARY"
        env:
          SWIFT: ${{ steps.versions.outputs.swift }}
          SWIFT_FORMAT: ${{ steps.versions.outputs.swift_format }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - run: |
          sed -i "s|swift-format@sha256:[0-9a-f]*|swift-format@$DIGEST|" action.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- action.yml; then
            git commit --all --message "Pin the action to the swift-format $SWIFT_FORMAT image" --message "$IMAGE@$DIGEST"
            git push
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$SWIFT" > /dev/null; then
            git tag "v$SWIFT"
            git push origin "v$SWIFT"
          fi
        env:
          SWIFT: ${{ steps.versions.outputs.swift }}
          SWIFT_FORMAT: ${{ steps.versions.outputs.swift_format }}
          DIGEST: ${{ steps.push.outputs.digest }}
