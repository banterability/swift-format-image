---
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:15"
      timezone: "America/Chicago"
    commit-message:
      prefix: "🤖 "
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "swift"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:15"
      timezone: "America/Chicago"
    commit-message:
      prefix: "🤖 "
    cooldown:
      default-days: 3
